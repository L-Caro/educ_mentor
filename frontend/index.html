<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- PWA : couleur de la barre de statut sur Android -->
  <meta name="theme-color" content="#7d8cc4" />

  <!-- PWA iOS : active le mode plein écran depuis l'écran d'accueil -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ÉducMentor" />

  <!-- Manifest PWA (Chrome/Android) -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Icône iOS "Ajouter à l'écran d'accueil" — doit être un PNG.
       TODO : remplacer /icons/icon-192.png par un PNG 180×180 généré depuis icon.svg.
       Commande : npx @vite-pwa/assets-generator --preset minimal public/icons/icon.svg -->
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <!-- Favicon navigateur -->
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />

  <title>ÉducMentor</title>

  <script crossorigin="anonymous" src="https://kit.fontawesome.com/d75051c945.js"></script>
</head>
<body>
  <div id="root"></div>
  <script src="/src/main.tsx" type="module"></script>
</body>
</html>
