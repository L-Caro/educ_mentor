server {
    listen 80;

    # ── Fichiers statiques (React SPA) ────────────────────────────────────────
    # try_files : nginx cherche d'abord un fichier correspondant à l'URL ($uri),
    # puis un dossier ($uri/), et en dernier recours sert index.html.
    # C'est ce "dernier recours" qui permet au router React de gérer les URLs :
    # sans ça, un rafraîchissement sur /module/imagier renverrait un 404 nginx.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # ── API backend ───────────────────────────────────────────────────────────
    # "backend" est le nom du service dans docker-compose.
    # Docker Compose crée un réseau interne où chaque service est joignable par son nom.
    location /api/ {
        proxy_pass http://backend:4005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Images servies par le backend ─────────────────────────────────────────
    # Le backend sert les images via ServeStaticModule depuis /app/data/images.
    # On proxifie /media/ vers lui plutôt que de dupliquer le volume dans nginx.
    location /media/ {
        proxy_pass http://backend:4005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Les images peuvent être lourdes — on augmente la limite de réponse.
        proxy_read_timeout 60s;
    }
}
