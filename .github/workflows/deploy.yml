name: Deploy

on:
  push:
    branches:
      - main

jobs:
  # Barrière de qualité — s'exécute AVANT toute construction d'image.
  # Sans elle, chaque push déployait en production sans qu'aucun lint, typage ni test
  # n'ait été exécuté : le pipeline ne faisait qu'accélérer la mise en ligne de code cassé.
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # voir les deux paquets d'un coup plutôt qu'un puis l'autre
      matrix:
        package: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22      # même version que les Dockerfile
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  build:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/l-caro/educ_mentor-frontend:latest
            ghcr.io/l-caro/educ_mentor-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/l-caro/educ_mentor-backend:latest
            ghcr.io/l-caro/educ_mentor-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo docker compose -f /home/lionel/Lionel/development/educ_mentor/docker-compose.yml pull
            sudo docker compose -f /home/lionel/Lionel/development/educ_mentor/docker-compose.yml up -d
            # Purge restreinte aux images de ce projet : `prune -af` sans filtre supprimait
            # toutes les images inutilisées du VPS, y compris celles des autres projets.
            sudo docker image prune -af --filter 'label=org.opencontainers.image.source=https://github.com/${{ github.repository }}'
