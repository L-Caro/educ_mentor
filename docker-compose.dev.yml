services:
  backend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    # npm install au démarrage pour compiler les dépendances natives (better-sqlite3) pour Alpine
    command: sh -c "npm install && npm run start:dev"
    volumes:
      - ./backend:/app
      - backend_modules:/app/node_modules   # volume isolé : évite les conflits avec les node_modules du host
      # Monté à /data et NON à /app/data : imbriqué sous le bind ./backend:/app, il se faisait
      # écraser par celui-ci (Docker applique les montages dans l'ordre, et /app arrivait après
      # /app/data). Le conteneur créait alors une base vierge dans backend/data/ sur l'hôte :
      # modules inactifs, aucun mot, aucun texte, sans le moindre message d'erreur.
      - ./data:/data
    ports:
      - "4005:4005"
    env_file: .env
    environment:
      - CHOKIDAR_USEPOLLING=true            # nécessaire dans Docker/WSL pour que le watcher NestJS détecte les changements
      # Chemins absolus : ils priment sur ceux du .env, qui sont relatifs au répertoire de travail.
      - DB_PATH=/data/educmentor.db
      - IMAGES_PATH=/data/images

  frontend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    ports:
      - "6005:6005"
    environment:
      - BACKEND_URL=http://backend:4005     # nom du service Docker, pas localhost
      - DOCKER_DEV=true                     # active le polling Vite (nécessaire dans Docker)
    depends_on:
      - backend

volumes:
  backend_modules:
  frontend_modules:
